<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvancaTech - Acesso ao Terminal</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="form-container">
        <form class="cyber-form" style="border: 1px solid #ff00ff; padding: 30px; box-shadow: 0 0 15px #ff00ff;">
            <h2 style="text-align: center; color: #fff; text-shadow: 0 0 10px #ff00ff; margin-bottom: 20px;">ACESSO AO
                TERMINAL</h2>

            <label>USUÁRIO (EMAIL)</label>
            <input type="email" placeholder="Fazer login no sistema...">

            <label>CHAVE DE ACESSO (SENHA)</label>
            <input type="password" placeholder="Digite sua senha secreta...">

            <button type="submit" class="btn-enviar" style="border-color: #ff00ff; color: #ff00ff;">AUTENTICAR</button>
            <p style="text-align: center; font-size: 12px; margin-top: 15px;"><a href="index.html"
                    style="color: #00d4ff; text-decoration: none;">Voltar para a Home</a></p>
        </form>
    </div>
</body>

</html>
