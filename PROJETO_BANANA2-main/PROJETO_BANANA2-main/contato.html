<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AvancaTech - Fale Conosco</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>

    <header>
        <div class="logo">Banana <span class="neon-blue">CADASTRO</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Principal</a></li>
                <li><a href="produto.html">Produtos</a></li>
                <li><a href="historia.html">Nossa História</a></li>
                <li><a href="contato.html" class="active">Fale Conosco</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="secao-contato">
            <div class="card-formulario">
                <h2>ENTRE EM CONTATO</h2>
                
                <form action="#" method="POST">
                    <div class="form-linha">
                        <div class="form-group flex-2">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" placeholder="Digite seu nome completo">
                        </div>
                        <div class="form-group flex-3">
                            <label for="endereco">Endereço</label>
                            <input type="text" id="endereco" placeholder="Rua, número...">
                        </div>
                    </div>

                    <div class="form-linha">
                        <div class="form-group">
                            <label for="cep">CEP</label>
                            <input type="text" id="cep" placeholder="00000-000">
                        </div>
                        <div class="form-group">
                            <label for="bairro">Bairro</label>
                            <input type="text" id="bairro" placeholder="Seu bairro">
                        </div>
                        <div class="form-group">
                            <label for="cidade">Cidade</label>
                            <input type="text" id="cidade" placeholder="Sua cidade">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="comentario">Comentário</label>
                        <textarea id="comentario" rows="5" placeholder="Escreva sua mensagem aqui..."></textarea>
                    </div>

                    <button type="submit" class="btn-enviar">CADASTRAR</button>
                </form>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 AvancaTech</p>
        <div class="social-grid">
            <a href="#" class="btn-cyber facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" class="btn-cyber linkedin"><i class="fa-brands fa-linkedin-in"></i></a>
            <a href="#" class="btn-cyber instagram"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </footer>

</body>

</html>
